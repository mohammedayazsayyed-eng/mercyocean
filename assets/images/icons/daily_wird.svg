<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Raised hands in dua -->
  <g stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hand -->
    <path d="M30 75 L30 45 Q30 35 38 35 L42 35 L42 55 Q42 60 38 60 L34 60"/>
    <!-- Right hand -->
    <path d="M70 75 L70 45 Q70 35 62 35 L58 35 L58 55 Q58 60 62 60 L66 60"/>
    <!-- Wrist lines -->
    <line x1="28" y1="75" x2="40" y2="75"/>
    <line x1="72" y1="75" x2="60" y2="75"/>
  </g>

  <!-- Tasbeeh hanging between hands -->
  <path d="M36 65 Q50 85 64 65" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <g fill="currentColor">
    <circle cx="38" cy="67" r="2.5"/>
    <circle cx="42" cy="72" r="2.5"/>
    <circle cx="47" cy="76" r="2.5"/>
    <circle cx="50" cy="78" r="3.5"/>
    <circle cx="53" cy="76" r="2.5"/>
    <circle cx="58" cy="72" r="2.5"/>
    <circle cx="62" cy="67" r="2.5"/>
  </g>

  <!-- Small sun -->
  <circle cx="78" cy="22" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="78" y1="10" x2="78" y2="6"/>
    <line x1="88" y1="18" x2="92" y2="14"/>
    <line x1="90" y1="26" x2="94" y2="26"/>
    <line x1="88" y1="34" x2="92" y2="38"/>
    <line x1="78" y1="34" x2="78" y2="38"/>
  </g>

  <!-- "1x" badge -->
  <rect x="72" y="44" width="16" height="10" rx="5" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.2"/>
  <text x="80" y="52" text-anchor="middle" font-size="7" font-family="sans-serif" font-weight="bold" fill="currentColor">1x</text>
</svg>