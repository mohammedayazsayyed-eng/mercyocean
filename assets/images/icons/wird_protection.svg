    <circle cx="50" cy="76" r="5"/>
    <line x1="50" y1="88" x2="55" y2="88"/>
    <line x1="50" y1="85" x2="54" y2="85"/>
  </g>

  <!-- Sparkles -->
  <g fill="currentColor" opacity="0.5">
    <polygon points="14,36 15,39 18,39 16,41 17,44 14,42 11,44 12,41 10,39 13,39"/>
    <polygon points="86,36 87,39 90,39 88,41 89,44 86,42 83,44 84,41 82,39 85,39"/>
  </g>
</svg>