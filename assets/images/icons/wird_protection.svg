<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Shield -->
  <path d="M50 8 L82 22 L82 54 Q82 76 50 92 Q18 76 18 54 L18 22 Z" 
        stroke="currentColor" stroke-width="2.8" fill="none" stroke-linejoin="round"/>

  <!-- Shield inner detail -->
  <line x1="50" y1="16" x2="50" y2="86" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="22" y1="44" x2="78" y2="44" stroke="currentColor" stroke-width="1" opacity="0.3"/>

  <!-- Heart -->
  <path d="M50 38 Q40 26 30 36 Q20 46 30 54 L50 72 L70 54 Q80 46 70 36 Q60 26 50 38 Z" 
        stroke="currentColor" stroke-width="2.2" fill="none" stroke-linejoin="round"/>

